[project]
name = "daily-ai-digest"
version = "1.0.0"
description = "Daily AI/IT industry news digest — auto-generated with DeepSeek, deployed to GitHub Pages"
requires-python = ">=3.11"
dependencies = [
    "feedparser>=6.0",
    "praw>=7.7",
    "requests>=2.31",
    "openai>=1.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "pydantic>=2.0",
    "python-frontmatter>=1.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "markdown>=3.5",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml>=6.0",
    "types-requests>=2.31",
]

[tool.ruff]
target-version = "py311"
line-length = 130

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]  # Line length handled by formatter

[tool.ruff.lint.per-file-ignores]
"src/collect/github_trending.py" = ["F821"]  # Forward ref to Article
"src/collect/reddit_fetcher.py" = ["F821"]  # Forward ref to Article
"tests/*" = ["F841"]  # Unused variables in test assertions

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short --cov=src --cov-report=term-missing"
